<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Escolha o que transmitir</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; background: #0e1019; color: #e8eaf4; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 18px 22px 10px; }
  h1 { margin: 0 0 12px; font-size: 20px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { border: 0; background: transparent; color: #858ba8; font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  .tabs button.on { background: #232842; color: #fff; }
  main { flex: 1; overflow-y: auto; padding: 8px 22px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; align-content: start; }
  .src { background: #151826; border: 2px solid transparent; border-radius: 12px; padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; transition: border-color .12s, transform .12s; }
  .src:hover { border-color: #3a4066; transform: translateY(-2px); }
  .src.on { border-color: #7c5cff; }
  .src img.t { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; border-radius: 8px; display: block; }
  .src div { display: flex; align-items: center; gap: 6px; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src div img { width: 16px; height: 16px; }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 22px; background: #08090f; }
  footer small { color: #858ba8; }
  footer button { border: 0; font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 8px; cursor: pointer; }
  #cancel { background: transparent; color: #b4b9d0; }
  #go { background: #7c5cff; color: #fff; }
  #go:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><h1>Escolha o que transmitir</h1><div class="tabs"><button class="on" data-t="screen">Telas</button><button data-t="window">Janelas</button></div></header>
<main id="list"></main>
<footer><small>Para controle remoto, escolha a tela inteira.</small><span><button id="cancel">Cancelar</button><button id="go" disabled>Transmitir</button></span></footer>
<script>
  let all = [], tab = "screen", sel = null;
  const list = document.getElementById("list"), go = document.getElementById("go");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function draw() {
    const items = all.filter(s => s.screen === (tab === "screen"));
    list.innerHTML = items.map(s => `<button class="src${s.id === sel ? " on" : ""}" data-id="${esc(s.id)}">${s.thumb ? `<img class="t" src="${s.thumb}" alt="">` : ""}<div>${s.icon ? `<img src="${s.icon}" alt="">` : ""}${esc(s.name)}</div></button>`).join("") || `<p style="color:#858ba8">Nada encontrado.</p>`;
    go.disabled = !sel;
  }
  document.querySelector(".tabs").onclick = e => { const b = e.target.closest("[data-t]"); if (!b) return; tab = b.dataset.t; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b)); draw(); };
  list.onclick = e => { const b = e.target.closest("[data-id]"); if (b) { sel = b.dataset.id; draw(); } };
  list.ondblclick = e => { const b = e.target.closest("[data-id]"); if (b) window.picker.choose(b.dataset.id); };
  go.onclick = () => sel && window.picker.choose(sel);
  document.getElementById("cancel").onclick = () => window.picker.choose(null);
  document.addEventListener("keydown", e => { if (e.key === "Escape") window.picker.choose(null); if (e.key === "Enter" && sel) window.picker.choose(sel); });
  window.picker.onSources(s => { all = s; const first = all.find(x => x.screen); sel = first ? first.id : null; draw(); });
</script>
</body>
</html>
