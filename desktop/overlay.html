<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'self'">
<title>Sobreposição</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; font: 600 13px/1.2 "Segoe UI", system-ui, sans-serif; color: #fff; }
  #root { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px; }
  #root.right { align-items: flex-end; }
  .head { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 4px 9px; border-radius: 8px; background: rgba(8,9,15,.72); font-size: 11.5px; color: #c9cbe0; max-width: 236px; }
  #root.right .head { align-self: flex-end; }
  .head i { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; flex: none; }
  .head span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 3px; border-radius: 99px; background: rgba(8,9,15,.62); max-width: 236px; transition: background .12s; }
  .p.speaking { background: rgba(8,9,15,.85); }
  .av { position: relative; width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; background: var(--c, #555); box-shadow: 0 0 0 2px transparent; transition: box-shadow .12s; overflow: hidden; }
  .p.speaking .av { box-shadow: 0 0 0 2px #23d160, 0 0 10px rgba(35,209,96,.6); }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.8); opacity: .82; }
  .p.speaking .nm { opacity: 1; }
  .ic { font-size: 11px; opacity: .9; flex: none; }
  .live { font-size: 9.5px; font-weight: 800; letter-spacing: .3px; padding: 1px 5px; border-radius: 4px; background: #ef4444; flex: none; }
  .more { font-size: 11.5px; color: #c9cbe0; padding: 2px 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="overlay.js"></script>
</body>
</html>
