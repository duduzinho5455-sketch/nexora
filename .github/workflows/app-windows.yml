name: App de PC (Windows)

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "public/icons/**"
      - "public/agente/**"
      - ".github/workflows/app-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force agente | Out-Null
          Copy-Item ../public/agente/nexora-agente.ps1 agente/ -Force
          npm version "3.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      # Driver de controles virtuais (ViGEmBus, licença BSD-3): vai dentro do app para o botão "Ativar controles".
      # Versão e SHA-256 fixos: se o arquivo baixado for diferente, o build para.
      - name: Embutir o instalador do ViGEmBus
        shell: pwsh
        run: |
          $url = "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe"
          $out = "vigem/ViGEmBus-Setup.exe"
          Invoke-WebRequest $url -OutFile $out
          $h = (Get-FileHash $out -Algorithm SHA256).Hash
          if ($h -ne "89220A7865076B342892F98865F3499FB7C4CFD673159E89D352C360FD014C6A") { throw "SHA-256 do ViGEmBus diferente: $h" }
          $sig = Get-AuthenticodeSignature $out
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notlike "*Nefarius Software Solutions*") { throw "Assinatura do ViGEmBus inválida: $($sig.Status)" }

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Montar o instalador
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Garante que o "Ativar controles" vai funcionar: driver e agente dentro do app montado
      - name: Conferir o que foi embutido
        shell: pwsh
        run: |
          $r = "dist/win-unpacked/resources"
          foreach ($f in "vigem/ViGEmBus-Setup.exe", "vigem/LICENCA-ViGEmBus.txt", "agente/nexora-agente.ps1") {
            if (-not (Test-Path "$r/$f")) { throw "Faltou no app: $f" }
          }
          if ((Get-FileHash "$r/vigem/ViGEmBus-Setup.exe" -Algorithm SHA256).Hash -ne "89220A7865076B342892F98865F3499FB7C4CFD673159E89D352C360FD014C6A") { throw "Instalador do driver diferente dentro do app" }
          if (-not (Select-String -Path "$r/agente/nexora-agente.ps1" -SimpleMatch 'hello 3' -Quiet)) { throw "Agente antigo dentro do app" }
          Write-Host "OK: driver, licença e agente v3 dentro do app"

      - name: Copiar com o nome antigo
        shell: pwsh
        run: Copy-Item dist/Auryx-Nexos-Setup.exe dist/Auryx-Nexavoria-Setup.exe -Force   # links velhos também baixam o app novo

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v3.0.${{ github.run_number }}
          name: Auryx Nexos para Windows 3.0.${{ github.run_number }}
          body: |
            Baixe **Auryx-Nexos-Setup.exe**, abra e pronto — o atalho aparece na área de trabalho.
            Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações › Executar assim mesmo**
            (acontece porque o app ainda não tem assinatura digital paga).
          files: |
            desktop/dist/Auryx-Nexos-Setup.exe
            desktop/dist/Auryx-Nexavoria-Setup.exe
          make_latest: true
