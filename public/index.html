<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a12"><title>NEXORA</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="auth" class="auth"><div class="authbox"><div class="logo">N</div><h1>NEXORA</h1><p>Sua comunidade. Sua conexão.</p><div class="tabs"><button id="loginTab" class="active">Entrar</button><button id="registerTab">Criar conta</button></div><form id="authForm"><label>Usuário</label><input id="username" minlength="3" maxlength="24" required><label>Senha</label><input id="password" type="password" minlength="8" required><button class="primary" id="authSubmit">Entrar</button></form><small id="authError"></small></div></div>
<div id="app" class="app hidden"><aside class="servers"><div class="logo mini">N</div><div class="bubble">✦</div><div class="bubble add">＋</div></aside><aside class="channels"><header><b>NEXORA</b><small>Comunidade</small></header><h5>CANAIS DE TEXTO</h5><button class="channel selected" data-room="geral">#　geral</button><button class="channel" data-room="memes">#　memes</button><button class="channel" data-room="games">#　games</button><h5>SALAS DE VOZ</h5><button class="channel" id="voiceJoin">◖))　Entrada de voz</button><div class="me"><span id="myAvatar" class="avatar">N</span><span><b id="myName">Usuário</b><small>Online</small></span><button id="logout">⇥</button></div></aside><main><header class="top"><b id="roomTitle"># geral</b><span><i></i><span id="onlineCount">1 online</span></span></header><section id="messages" class="messages"></section><form id="chatForm" class="composer"><input id="chatInput" maxlength="2000" placeholder="Enviar mensagem em #geral" autocomplete="off"><button>➤</button></form></main><aside class="members"><h5>ONLINE — <span id="memberCount">1</span></h5><div id="memberList"></div></aside><footer><div><i></i><b id="callLabel">Conexão de voz</b><small id="callStatus">Desconectado</small></div><button id="muteBtn">🎙 Microfone</button><button id="screenBtn">▣ Compartilhar tela</button><button id="leaveCall" class="danger">Sair da sala</button></footer></div><div id="toast"></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
