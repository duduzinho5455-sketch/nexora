<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="dark light">
<meta name="description" content="NEXORA — sua comunidade, sua conexão.">
<title>NEXORA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='14' fill='%2311131f'/%3E%3Cpath d='M15 34V14l18 20V14' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   NEXORA — visual
   Animações só com transform/opacity (GPU), sem bibliotecas externas.
   ===================================================================== */
:root {
  --accent: #7c5cff;
  --accent-2: #22d3ee;
  --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
  --bg-0: #08090f;
  --bg-1: #0e1019;
  --bg-2: #131624;
  --bg-3: #1a1e30;
  --bg-4: #232842;
  --hover: rgba(255, 255, 255, .045);
  --active: rgba(255, 255, 255, .08);
  --line: rgba(255, 255, 255, .06);
  --line-2: rgba(255, 255, 255, .1);
  --text: #e8eaf4;
  --text-2: #b4b9d0;
  --muted: #858ba8;
  --dim: #5d6384;
  --green: #23d18b;
  --yellow: #f5b83d;
  --red: #f04760;
  --blue: #5b9dff;
  --mention: rgba(245, 184, 61, .09);
  --mention-line: #f5b83d;
  --shadow: 0 12px 40px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
  --r: 10px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
[data-theme="midnight"] {
  --bg-0: #000; --bg-1: #05060a; --bg-2: #090a10; --bg-3: #10121b; --bg-4: #181b28;
  --line: rgba(255, 255, 255, .07);
}
[data-theme="light"] {
  --bg-0: #e4e6ef; --bg-1: #eef0f6; --bg-2: #f9fafc; --bg-3: #e8eaf2; --bg-4: #dcdfea;
  --hover: rgba(20, 24, 50, .05); --active: rgba(20, 24, 50, .09);
  --line: rgba(20, 24, 50, .08); --line-2: rgba(20, 24, 50, .14);
  --text: #191c2b; --text-2: #3b4058; --muted: #5d6384; --dim: #8a90ab;
  --mention: rgba(245, 184, 61, .16);
  --shadow: 0 12px 40px rgba(30, 35, 70, .18), 0 2px 8px rgba(30, 35, 70, .1);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg-2); color: var(--text); font: 15px/1.45 var(--font);
  -webkit-font-smoothing: antialiased; overflow: hidden; text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
.hidden { display: none !important; }
::selection { background: color-mix(in srgb, var(--accent) 45%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* barras de rolagem finas */
* { scrollbar-width: thin; scrollbar-color: var(--bg-4) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.ic.xs { width: 13px; height: 13px; }
.ic.lg { width: 26px; height: 26px; }

/* ---------- boot ---------- */
.boot { position: fixed; inset: 0; display: grid; place-content: center; gap: 22px; justify-items: center; background: var(--bg-0); z-index: 50; transition: opacity .35s; }
.boot.out { opacity: 0; pointer-events: none; }
.boot-logo { width: 64px; height: 64px; animation: pulse 1.4s var(--ease) infinite; }
.boot-bar { width: 120px; height: 3px; border-radius: 3px; background: var(--bg-3); overflow: hidden; }
.boot-bar i { display: block; width: 40%; height: 100%; background: var(--grad); animation: slide 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.9); opacity: .75; } }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

.logo svg, [data-logo] svg { width: 100%; height: 100%; display: block; }

/* ---------- botões e campos ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 16px;
  border-radius: 8px; font-weight: 600; font-size: 14px; background: var(--bg-4); color: var(--text);
  transition: transform .15s var(--ease), background .15s, box-shadow .2s, opacity .15s; white-space: nowrap;
}
.btn:hover { background: color-mix(in srgb, var(--bg-4) 80%, #fff 10%); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 16px -4px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #fff); }
.btn.grad { background: var(--grad); color: #fff; }
.btn.danger { background: var(--red); color: #fff; }
.btn.ghost { background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.green { background: var(--green); color: #052b1c; }
.btn.big { min-height: 46px; font-size: 15px; width: 100%; }
.btn.sm { min-height: 30px; padding: 0 12px; font-size: 13px; }
.btn[disabled], .btn.loading { opacity: .6; pointer-events: none; }
.btn.loading::after { content: ""; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.icon-btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; color: var(--muted);
  transition: background .15s, color .15s, transform .15s var(--ease);
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.on { color: var(--text); background: var(--active); }
.icon-btn.bad { color: var(--red); }

.field { display: grid; gap: 7px; margin-bottom: 16px; }
.field > span, .label { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.input, .field input, .field textarea, .field select, select.input {
  width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-1); color: var(--text);
  outline: none; transition: border-color .15s, box-shadow .15s, background .15s;
}
.field textarea { resize: vertical; min-height: 70px; }
.input:focus, .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.hint { font-size: 12.5px; color: var(--muted); margin: -8px 0 14px; }

.switch { position: relative; width: 42px; height: 24px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 20px; background: var(--bg-4); transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .25s var(--spring); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + i { background: var(--green); }
.switch input:checked + i::after { transform: translateX(18px); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle-row b { display: block; font-weight: 600; font-size: 14.5px; }
.toggle-row small { color: var(--muted); font-size: 13px; }

/* ---------- autenticação ---------- */
.auth { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: var(--bg-0); overflow: hidden; }
.auth-bg { position: absolute; inset: 0; pointer-events: none; }
.auth-bg i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(70px); opacity: .45; will-change: transform; }
.auth-bg i:nth-child(1) { background: var(--accent); top: -18vmax; left: -12vmax; animation: drift1 18s ease-in-out infinite alternate; }
.auth-bg i:nth-child(2) { background: var(--accent-2); bottom: -22vmax; right: -14vmax; opacity: .3; animation: drift2 22s ease-in-out infinite alternate; }
.auth-bg i:nth-child(3) { background: #f472b6; width: 26vmax; height: 26vmax; top: 40%; left: 55%; opacity: .16; animation: drift1 26s ease-in-out infinite alternate-reverse; }
.auth-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 46px 46px; mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%); }
@keyframes drift1 { to { transform: translate(10vmax, 8vmax) scale(1.1); } }
@keyframes drift2 { to { transform: translate(-8vmax, -10vmax) scale(.9); } }
.auth-card {
  position: relative; width: min(420px, 100%); padding: 34px 32px 28px; border-radius: 18px;
  background: color-mix(in srgb, var(--bg-1) 82%, transparent); border: 1px solid var(--line-2);
  box-shadow: var(--shadow); backdrop-filter: blur(18px); animation: rise .6s var(--ease) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
.brand { display: flex; align-items: center; gap: 12px; justify-content: center; }
.brand .logo { width: 46px; height: 46px; }
.brand h1 { margin: 0; font-size: 28px; letter-spacing: .14em; font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.auth-sub { text-align: center; color: var(--muted); margin: 8px 0 22px; }
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-0); border-radius: 10px; padding: 4px; margin-bottom: 22px; }
.seg button { position: relative; z-index: 1; height: 36px; border-radius: 7px; font-weight: 600; color: var(--muted); transition: color .2s; }
.seg button.on { color: var(--text); }
.seg-ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 7px; background: var(--bg-4); transition: transform .3s var(--spring); }
.seg.right .seg-ind { transform: translateX(100%); }
.auth-err { min-height: 20px; color: var(--red); font-size: 13.5px; margin: -4px 0 10px; }
.auth-err:not(:empty) { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.auth-note { text-align: center; color: var(--yellow); font-size: 13.5px; margin: 16px 0 0; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 74px 252px minmax(0, 1fr) 248px; height: 100dvh; animation: fadeIn .35s ease both; }
.app.no-members { grid-template-columns: 74px 252px minmax(0, 1fr) 0; }
.app.no-members .members { display: none; }
@keyframes fadeIn { from { opacity: 0; } }
.conn-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; text-align: center; padding: 5px; font-size: 13px; font-weight: 600; background: var(--yellow); color: #2b1d00; animation: down .3s var(--ease); }
@keyframes down { from { transform: translateY(-100%); } }

/* ---------- trilho de servidores ---------- */
.rail { background: var(--bg-0); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; overflow-y: auto; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail-list { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.rail-sep { width: 32px; height: 2px; border-radius: 2px; background: var(--line-2); flex: none; }
.rail-item { position: relative; width: 74px; display: grid; place-items: center; cursor: pointer; flex: none; outline: none; }
.rail-item .pill {
  position: absolute; left: 0; width: 4px; height: 8px; border-radius: 0 4px 4px 0; background: var(--text);
  transform: translateX(-4px); transition: transform .25s var(--spring), height .25s var(--spring);
}
.rail-item.unread .pill { transform: none; }
.rail-item:hover .pill { transform: none; height: 20px; }
.rail-item.on .pill { transform: none; height: 40px; }
.srv-icon {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: var(--bg-3); color: var(--text); font-weight: 700; font-size: 16px; letter-spacing: -.02em;
  transition: border-radius .25s var(--ease), background .2s, transform .2s var(--ease), box-shadow .25s;
  user-select: none;
}
.srv-icon img { width: 100%; height: 100%; object-fit: cover; }
.srv-icon.emoji { font-size: 24px; }
.rail-item:hover .srv-icon, .rail-item.on .srv-icon { border-radius: 16px; background: var(--c, var(--accent)); color: #fff; }
.rail-item.on .srv-icon { box-shadow: 0 6px 18px -6px var(--c, var(--accent)); }
.rail-item:active .srv-icon { transform: translateY(1px) scale(.96); }
.logo-icon { padding: 9px; background: var(--bg-3); }
.rail-item.home:hover .srv-icon, .rail-item.home.on .srv-icon { background: var(--accent); }
.rail-item.home:hover .srv-icon svg path, .rail-item.home.on .srv-icon svg path { stroke: #fff; }
.tool-icon { color: var(--green); }
.rail-item.tool:hover .srv-icon, .rail-item.tool.on .srv-icon { background: var(--green); color: #fff; }
.rail-item .badge { position: absolute; right: 10px; bottom: -2px; }
.rail-item .vc-dot { position: absolute; right: 10px; bottom: -2px; width: 20px; height: 20px; border-radius: 50%; background: var(--green); color: #052b1c; display: grid; place-items: center; border: 3px solid var(--bg-0); }
.rail-item .vc-dot .ic { width: 11px; height: 11px; stroke-width: 3; }
.rail-item.dragging { opacity: .4; }
.rail-item.drop-before::before { content: ""; position: absolute; top: -5px; left: 14px; right: 14px; height: 3px; border-radius: 3px; background: var(--green); }

.badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff;
  font-size: 11.5px; font-weight: 800; display: inline-grid; place-items: center; border: 3px solid var(--bg-0); box-sizing: content-box;
  animation: pop .35s var(--spring);
}
@keyframes pop { from { transform: scale(0); } }

/* ---------- barra lateral (canais) ---------- */
.side { background: var(--bg-1); display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
.side-head {
  height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 700;
  border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(0,0,0,.15); transition: background .15s; position: relative; overflow: hidden;
}
.side-head.clickable { cursor: pointer; }
.side-head.clickable:hover { background: var(--hover); }
.side-head .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-head .ic { color: var(--muted); transition: transform .25s var(--ease); }
.side-head.open .ic.chev { transform: rotate(180deg); }
.side-head.banner { height: 96px; align-items: flex-end; padding-bottom: 12px; color: #fff; border-bottom: 0; }
.side-head.banner::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 40%, #000)); z-index: -1; }
.side-head.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(0,0,0,.45)); z-index: -1; }
.side-head.banner { z-index: 0; }
.side-head.banner .ic { color: #fff; }
.side-body { flex: 1; overflow-y: auto; padding: 10px 8px 16px; }
.side-body.anim > * { animation: fadeUp .3s var(--ease) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } }
.cat { display: flex; align-items: center; justify-content: space-between; padding: 16px 8px 6px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.cat:first-child { padding-top: 6px; }
.cat button { color: var(--muted); display: grid; place-items: center; border-radius: 4px; }
.cat button:hover { color: var(--text); }
.ch {
  position: relative; display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; margin: 1px 0;
  border-radius: 7px; color: var(--muted); cursor: pointer; transition: background .12s, color .12s; outline: none;
}
.ch:hover { background: var(--hover); color: var(--text-2); }
.ch.on { background: var(--active); color: var(--text); }
.ch.unread { color: var(--text); font-weight: 600; }
.ch.unread::before { content: ""; position: absolute; left: -8px; width: 4px; height: 8px; border-radius: 0 4px 4px 0; background: var(--text); }
.ch .ic { color: var(--dim); }
.ch.on .ic, .ch:hover .ic { color: var(--muted); }
.ch-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-tools { display: none; gap: 2px; }
.ch:hover .ch-tools, .ch.on .ch-tools { display: flex; }
.ch-tools i { display: grid; place-items: center; color: var(--muted); border-radius: 4px; }
.ch-tools i:hover { color: var(--text); }
.ch .badge { border: 0; }
.ch .count { font-size: 12px; color: var(--muted); }
.ch.live .ic { color: var(--green); }
.vc-users { padding: 2px 0 6px 30px; display: grid; gap: 1px; }
.vc-user { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; color: var(--muted); font-size: 14px; cursor: pointer; }
.vc-user:hover { background: var(--hover); color: var(--text-2); }
.vc-user .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vc-user .flags { display: flex; gap: 4px; align-items: center; color: var(--dim); }
.vc-user.speaking .name { color: var(--text); }
.live-tag { font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 1px 5px; border-radius: 4px; background: var(--red); color: #fff; }

/* menu suspenso do servidor */
.dropdown { position: absolute; z-index: 20; }

/* ---------- painel de voz e usuário ---------- */
.voice-panel { border-top: 1px solid var(--line); padding: 10px 10px 8px; background: var(--bg-0); animation: fadeUp .3s var(--ease); }
.vp-row { display: flex; align-items: center; gap: 6px; }
.vp-status { flex: 1; min-width: 0; }
.vp-status b { display: flex; align-items: center; gap: 6px; color: var(--green); font-size: 14px; }
.vp-status b.wait { color: var(--yellow); }
.vp-status small { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.vp-status small:hover { text-decoration: underline; color: var(--text-2); }
.vp-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.vp-actions .btn { min-height: 32px; font-size: 13px; padding: 0 8px; background: var(--bg-3); }
.vp-actions .btn.on { background: color-mix(in srgb, var(--green) 22%, var(--bg-3)); color: var(--green); }
.user-panel { display: flex; align-items: center; gap: 4px; padding: 8px; background: var(--bg-0); border-top: 1px solid var(--line); }
.me-card { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
.me-card:hover { background: var(--hover); }
.me-card .who { min-width: 0; line-height: 1.2; }
.me-card b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-card small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-panel .icon-btn { width: 32px; height: 32px; }
.user-panel .icon-btn.bad { color: var(--red); }

/* ---------- avatar e status ---------- */
.av {
  --s: 40px; position: relative; width: var(--s); height: var(--s); flex: none; border-radius: 50%;
  background: var(--c, var(--accent)); color: #fff; display: inline-grid; place-items: center;
  font-weight: 700; font-size: calc(var(--s) * .42); user-select: none; transition: box-shadow .15s;
}
.av > img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.av .av-emoji { font-size: calc(var(--s) * .55); line-height: 1; }
.av .st {
  position: absolute; right: -2px; bottom: -2px; width: calc(var(--s) * .32 + 4px); height: calc(var(--s) * .32 + 4px);
  min-width: 12px; min-height: 12px; border-radius: 50%; border: 3px solid var(--ring, var(--bg-1)); background: var(--dim);
}
.st-online { background: var(--green) !important; }
.st-idle { background: var(--yellow) !important; }
.st-dnd { background: var(--red) !important; }
.st-offline { background: var(--dim) !important; }
.speaking .av, .av.speaking { box-shadow: 0 0 0 2px var(--bg-1), 0 0 0 4px var(--green); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }

/* ---------- topo ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-2); position: relative; }
.top {
  height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px;
  border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(0,0,0,.12); z-index: 2; background: var(--bg-2);
}
.top-icon { color: var(--dim); display: grid; }
.top-title { font-weight: 700; white-space: nowrap; }
.top-topic { flex: 1; min-width: 0; color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 12px; margin-left: 2px; border-left: 1px solid var(--line-2); }
.top-topic:empty { border: 0; }
.top-actions { display: flex; gap: 4px; margin-left: auto; }
.only-mobile { display: none !important; }

.view { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.view.enter { animation: viewIn .28s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }

/* ---------- mensagens ---------- */
.messages { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.msg-list { padding: 16px 0 10px; min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.chan-intro { padding: 24px 18px 18px; }
.chan-intro .big { width: 68px; height: 68px; border-radius: 50%; background: var(--bg-4); display: grid; place-items: center; margin-bottom: 12px; color: var(--text); }
.chan-intro .big .ic { width: 36px; height: 36px; }
.chan-intro h2 { margin: 0 0 4px; font-size: 28px; }
.chan-intro p { margin: 0; color: var(--muted); }
.day { display: flex; align-items: center; gap: 10px; margin: 18px 16px 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.new-line { display: flex; align-items: center; margin: 8px 16px 0 16px; height: 0; border-top: 1px solid var(--red); position: relative; }
.new-line span { position: absolute; right: 0; top: -9px; background: var(--red); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 4px; }
.skeleton { padding: 14px 16px; display: flex; gap: 14px; }
.skeleton i { display: block; border-radius: 6px; background: linear-gradient(90deg, var(--bg-3), var(--bg-4), var(--bg-3)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

.msg {
  position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); padding: 3px 48px 3px 14px;
  margin-top: 14px;
}
.msg.cont { margin-top: 0; }
.msg:hover { background: rgba(0, 0, 0, .1); }
[data-theme="light"] .msg:hover { background: rgba(20, 24, 50, .035); }
.msg.new { animation: msgIn .32s var(--ease); }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } }
.msg.pending .msg-text { opacity: .55; }
.msg.failed .msg-text { color: var(--red); }
.msg.mention { background: var(--mention); }
.msg.mention::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--mention-line); }
.msg.highlight { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--accent) 18%, transparent); } }
.msg > .av { margin-top: 2px; cursor: pointer; }
.msg > .av:active { transform: translateY(1px); }
.msg-side-time { font-size: 10.5px; color: var(--dim); opacity: 0; text-align: center; padding-top: 4px; padding-right: 14px; user-select: none; white-space: nowrap; }
.msg:hover .msg-side-time { opacity: 1; }
.msg-head { display: flex; align-items: baseline; gap: 8px; line-height: 1.3; margin-bottom: 1px; }
.msg-author { font-weight: 600; cursor: pointer; }
.msg-author:hover { text-decoration: underline; }
.msg-head time { font-size: 12px; color: var(--dim); }
.owner-tag .ic { color: var(--yellow); width: 14px; height: 14px; vertical-align: -2px; }
.msg-text { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; color: var(--text); }
.msg-text.jumbo { font-size: 42px; line-height: 1.2; }
.msg-text .edited { font-size: 11px; color: var(--dim); margin-left: 4px; }
.msg-text code { font-family: var(--mono); font-size: 13.5px; background: var(--bg-0); padding: 1px 5px; border-radius: 5px; }
.msg-text pre { white-space: pre-wrap; margin: 6px 0; padding: 10px 12px; background: var(--bg-0); border: 1px solid var(--line); border-radius: 8px; max-width: 760px; overflow-x: auto; }
.msg-text pre code { background: none; padding: 0; }
.msg-text .quote { display: inline-block; border-left: 4px solid var(--bg-4); padding-left: 10px; color: var(--text-2); }
.spoiler { background: var(--bg-4); color: transparent; border-radius: 4px; cursor: pointer; transition: color .2s, background .2s; }
.spoiler.show { color: inherit; background: var(--hover); }
.mention { background: color-mix(in srgb, var(--accent) 22%, transparent); color: color-mix(in srgb, var(--accent) 50%, var(--text)); border-radius: 4px; padding: 0 3px; font-weight: 600; cursor: pointer; }
.mention:hover { background: var(--accent); color: #fff; }
.msg-img { display: block; margin-top: 6px; max-width: min(420px, 100%); max-height: 320px; border-radius: 10px; cursor: zoom-in; background: var(--bg-3); }
.msg-reply { grid-column: 2; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin: 0 0 3px; position: relative; cursor: pointer; min-width: 0; }
.msg-reply::before { content: ""; position: absolute; left: -36px; top: 50%; width: 30px; height: 10px; border-left: 2px solid var(--bg-4); border-top: 2px solid var(--bg-4); border-top-left-radius: 6px; }
.msg-reply b { color: var(--text-2); font-weight: 600; flex: none; }
.msg-reply span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-reply:hover span { color: var(--text); }
.msg.sys { grid-template-columns: 56px 1fr; align-items: center; color: var(--muted); font-size: 14px; margin-top: 10px; }
.msg.sys .ic { color: var(--green); justify-self: center; }
.msg.sys b { color: var(--text); font-weight: 600; cursor: pointer; }
.msg.sys time { font-size: 12px; color: var(--dim); margin-left: 6px; }

.reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.react {
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px; border-radius: 8px;
  background: var(--bg-3); border: 1px solid transparent; font-size: 14px; transition: background .12s, border-color .12s, transform .15s var(--spring);
}
.react:hover { border-color: var(--line-2); }
.react:active { transform: scale(.9); }
.react b { font-size: 12.5px; color: var(--text-2); font-weight: 600; }
.react.on { background: color-mix(in srgb, var(--accent) 20%, var(--bg-3)); border-color: var(--accent); }
.react.on b { color: var(--text); }
.react.add { opacity: 0; color: var(--muted); }
.msg:hover .react.add { opacity: 1; }
.react.add .ic { width: 15px; height: 15px; }
.react.bump { animation: bump .35s var(--spring); }
@keyframes bump { 50% { transform: scale(1.18); } }

.msg-actions {
  position: absolute; right: 16px; top: -14px; display: none; background: var(--bg-1); border: 1px solid var(--line-2);
  border-radius: 8px; box-shadow: var(--shadow); padding: 2px; z-index: 3;
}
.msg:hover .msg-actions { display: flex; animation: popIn .14s var(--ease); }
.msg-actions button { width: 32px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
.msg-actions button:hover { background: var(--hover); color: var(--text); }
.msg-actions button.danger:hover { color: var(--red); }
.msg-actions .ic { width: 18px; height: 18px; }
.msg-actions .quick { font-size: 16px; }
@keyframes popIn { from { opacity: 0; transform: scale(.94); } }

.edit-box textarea { width: 100%; min-height: 44px; resize: none; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--bg-3); outline: none; color: var(--text); }
.edit-box small { color: var(--muted); font-size: 12px; }
.edit-box small a { cursor: pointer; }

.jump {
  position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 20px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; box-shadow: var(--shadow);
  animation: popIn .2s var(--ease);
}
.jump .ic { width: 16px; height: 16px; }

/* ---------- composição ---------- */
.composer-wrap { position: relative; padding: 0 16px 4px; flex: none; }
.composer {
  display: flex; align-items: flex-end; gap: 4px; padding: 6px 6px 6px 8px; border-radius: 12px; background: var(--bg-3);
  border: 1px solid transparent; transition: border-color .15s, box-shadow .2s;
}
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 50%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
.composer textarea {
  flex: 1; resize: none; border: 0; outline: none; background: transparent; padding: 7px 4px; max-height: 40vh; min-height: 34px; line-height: 1.4;
}
.composer textarea::placeholder { color: var(--dim); }
.composer .send { color: var(--accent); }
.composer .send:hover { background: var(--accent); color: #fff; }
.reply-bar + .composer, .reply-bar:not(.hidden) + .composer { border-top-left-radius: 0; border-top-right-radius: 0; }
.reply-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; font-size: 13px; color: var(--muted);
  background: var(--bg-1); border-radius: 12px 12px 0 0; animation: down2 .2s var(--ease);
}
@keyframes down2 { from { opacity: 0; transform: translateY(6px); } }
.reply-bar b { color: var(--text); }
.reply-bar .icon-btn { margin-left: auto; width: 24px; height: 24px; }
.typing { height: 22px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; padding-left: 4px; }
.typing b { color: var(--text-2); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--text-2); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
.mention-pop { position: absolute; left: 16px; right: 16px; bottom: calc(100% - 2px); background: var(--bg-1); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 6; animation: down2 .15s var(--ease); }
.mention-pop .label { padding: 4px 8px 6px; display: block; }
.mention-pop button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 6px; text-align: left; }
.mention-pop button.on, .mention-pop button:hover { background: var(--active); }
.mention-pop small { color: var(--muted); margin-left: auto; }

/* ---------- membros ---------- */
.members { background: var(--bg-1); overflow-y: auto; padding: 14px 8px; border-left: 1px solid var(--line); }
.members .cat { padding-left: 8px; }
.member { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; cursor: pointer; transition: background .12s, opacity .2s; }
.member:hover { background: var(--hover); }
.member.off { opacity: .45; }
.member.off:hover { opacity: 1; }
.member .who { min-width: 0; flex: 1; line-height: 1.25; }
.member b { display: flex; align-items: center; gap: 5px; font-weight: 500; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member .ic.xs { color: var(--yellow); }
.member .av { --ring: var(--bg-1); }
.member:hover .av { --ring: color-mix(in srgb, var(--bg-1) 90%, #fff); }

/* ---------- palco de voz ---------- */
.stage-view { background: #050609; }
[data-theme="light"] .stage-view { background: #12141d; color: #e8eaf4; }
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.stage-grid {
  flex: 1; min-height: 0; padding: 16px; display: grid; gap: 10px; align-content: center; justify-content: center;
  grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 560px)); overflow-y: auto;
}
.stage-grid.focus { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; align-content: stretch; }
.stage-grid.focus .strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
.stage-grid.focus .strip .tile { width: 200px; flex: none; }
.tile {
  position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: var(--c, #222);
  background: linear-gradient(135deg, color-mix(in srgb, var(--c, #555) 55%, #000), color-mix(in srgb, var(--c, #555) 25%, #000));
  display: grid; place-items: center; cursor: pointer; isolation: isolate; animation: tileIn .35s var(--spring);
  transition: box-shadow .15s; outline: none;
}
@keyframes tileIn { from { opacity: 0; transform: scale(.94); } }
.tile.big { aspect-ratio: auto; min-height: 0; height: 100%; max-height: 100%; }
.tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 0 var(--green); transition: box-shadow .15s; pointer-events: none; }
.tile.speaking::after { box-shadow: inset 0 0 0 3px var(--green); }
.tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 0; }
.tile.cam video { object-fit: cover; }
.tile.mirror video { transform: scaleX(-1); }
.tile .tile-av { z-index: 1; transition: transform .2s var(--ease); }
.tile.speaking .tile-av { transform: scale(1.04); }
.tile .tile-av .av { box-shadow: 0 8px 30px rgba(0,0,0,.35); }
.tile.speaking .tile-av .av { box-shadow: 0 0 0 4px var(--green), 0 8px 30px rgba(0,0,0,.35); }
.tile-name {
  position: absolute; left: 10px; bottom: 10px; z-index: 2; display: flex; align-items: center; gap: 6px; max-width: calc(100% - 20px);
  padding: 4px 9px; border-radius: 7px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 13px; font-weight: 600; backdrop-filter: blur(6px);
}
.tile-name .ic { width: 15px; height: 15px; color: var(--red); }
.tile-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-top { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 2; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.tile-top .live-tag { pointer-events: auto; }
.tile-stats { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.55); color: #ddd; }
.tile-btns { position: absolute; right: 10px; bottom: 10px; z-index: 2; display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
.tile:hover .tile-btns, .tile:focus-within .tile-btns { opacity: 1; }
.tile-btns button { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: rgba(0,0,0,.6); color: #fff; }
.tile-btns button:hover { background: rgba(0,0,0,.85); }
.tile-btns .ic { width: 17px; height: 17px; }
.tile-watch { z-index: 2; display: grid; justify-items: center; gap: 10px; color: #fff; text-align: center; }
.tile-watch small { color: rgba(255,255,255,.7); font-size: 12.5px; }
.tile.screen-off { background: linear-gradient(135deg, #1b1f30, #0d0f18); }
.tile:fullscreen { border-radius: 0; }
.stage-bar {
  flex: none; display: flex; justify-content: center; align-items: center; gap: 10px; padding: 12px 16px 18px;
}
.ctl {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: #23273a; color: #fff;
  transition: transform .15s var(--spring), background .15s;
}
.ctl:hover { background: #2e3350; transform: translateY(-2px); }
.ctl:active { transform: scale(.92); }
.ctl.off { background: #fff; color: #111; }
.ctl.on { background: var(--green); color: #052b1c; }
.ctl.red { background: var(--red); }
.ctl.red:hover { background: #ff5a72; }
.ctl .ic { width: 22px; height: 22px; }
.stage-empty { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 14px; padding: 24px; color: #e8eaf4; }
.stage-empty h2 { margin: 0; font-size: 26px; }
.stage-empty p { margin: 0; color: #9aa0b8; }
.stage-empty .faces { display: flex; }
.stage-empty .faces .av { margin-left: -8px; box-shadow: 0 0 0 3px #050609; }
.stage-empty .faces .av:first-child { margin: 0; }

/* mini player */
.mini {
  position: fixed; right: 20px; bottom: 20px; width: 320px; aspect-ratio: 16 / 9; z-index: 25; border-radius: 12px; overflow: hidden;
  background: #000; box-shadow: var(--shadow); animation: tileIn .3s var(--spring); cursor: pointer;
}
.mini video { width: 100%; height: 100%; object-fit: contain; }
.mini .mini-bar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 8px; background: linear-gradient(rgba(0,0,0,.7), transparent); color: #fff; font-size: 12.5px; font-weight: 600; opacity: 0; transition: opacity .15s; }
.mini:hover .mini-bar { opacity: 1; }
.mini .mini-bar button { margin-left: auto; color: #fff; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: rgba(0,0,0,.5); }

/* ---------- início e explorar ---------- */
.home-view, .discover-view { overflow-y: auto; }
.page { width: min(1080px, 100%); margin: 0 auto; padding: 28px 24px 48px; }
.hero {
  position: relative; border-radius: 18px; padding: 34px 32px; overflow: hidden; color: #fff; isolation: isolate;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 85%, #000), color-mix(in srgb, var(--accent-2) 55%, #000));
}
.hero::before { content: ""; position: absolute; width: 380px; height: 380px; right: -100px; top: -160px; border-radius: 50%; background: rgba(255,255,255,.12); z-index: -1; }
.hero::after { content: ""; position: absolute; width: 220px; height: 220px; right: 140px; bottom: -150px; border-radius: 50%; background: rgba(255,255,255,.08); z-index: -1; }
.hero h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -.01em; }
.hero p { margin: 0; opacity: .85; max-width: 560px; }
.hero .search { margin-top: 20px; max-width: 520px; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.95); color: #222; border-radius: 10px; padding: 0 14px; }
.hero .search input { flex: 1; border: 0; outline: none; background: transparent; padding: 13px 0; color: #111; }
.section-title { display: flex; align-items: center; gap: 10px; margin: 30px 0 14px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.qcard {
  display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 14px; background: var(--bg-1); border: 1px solid var(--line);
  text-align: left; transition: transform .2s var(--ease), border-color .2s, background .2s;
}
.qcard:hover { transform: translateY(-3px); border-color: var(--line-2); background: var(--bg-3); }
.qcard .qi { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--k, var(--accent)); color: #fff; flex: none; }
.qcard b { display: block; }
.qcard small { color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.scard {
  border-radius: 14px; overflow: hidden; background: var(--bg-1); border: 1px solid var(--line); cursor: pointer; text-align: left;
  transition: transform .22s var(--ease), box-shadow .22s, border-color .2s; display: flex; flex-direction: column;
}
.view.enter .scard, .view.enter .qcard, .view.enter .hero { animation: fadeUp .4s var(--ease) both; }
.view.enter .cards > :nth-child(2) { animation-delay: .04s; }
.view.enter .cards > :nth-child(3) { animation-delay: .08s; }
.view.enter .cards > :nth-child(4) { animation-delay: .12s; }
.view.enter .cards > :nth-child(n+5) { animation-delay: .16s; }
.switcher .srv-icon.mini, .srv-icon.mini { width: 24px; height: 24px; font-size: 11px; border-radius: 7px; background: var(--c); color: #fff; }
.srv-icon.mini.emoji { font-size: 14px; }
.user-panel .av, .voice-panel .av { --ring: var(--bg-0); }
.tile-name .ic.scr { color: #fff; }
.scard:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--line-2); }
.scard .sb { height: 84px; background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 35%, #000)); position: relative; }
.scard .si { position: absolute; left: 14px; bottom: -22px; border: 4px solid var(--bg-1); border-radius: 16px; }
.scard .si .srv-icon { border-radius: 12px; background: var(--c); color: #fff; }
.scard .sc { padding: 30px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.scard h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 6px; }
.scard p { margin: 0; color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
.scard .meta { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); align-items: center; margin-top: 4px; }
.scard .meta span { display: flex; align-items: center; gap: 5px; }
.empty { text-align: center; color: var(--muted); padding: 50px 20px; }
.empty .ic { width: 48px; height: 48px; color: var(--dim); margin-bottom: 8px; }
.vc-live { display: grid; gap: 8px; }
.vc-live .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--bg-1); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: background .15s; }
.vc-live .row:hover { background: var(--bg-3); }
.vc-live .faces { display: flex; margin-left: auto; }

const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const fmtTime = ts => new Date(ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

function fmtDay(ts) {
  const now = new Date(), y = new Date(); y.setDate(now.getDate() - 1);
  if (sameDay(ts, now)) return "Hoje";
  if (sameDay(ts, y)) return "Ontem";
  return new Date(ts).toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" });
}
function fmtStamp(ts) {
  const d = fmtDay(ts);
  return (d === "Hoje" || d === "Ontem" ? d + " às " : new Date(ts).toLocaleDateString("pt-BR") + " ") + fmtTime(ts);
}

function avatar(u, size = 40, status = false, attrs = "") {

}
function serverIcon(s, cls = "") {

  return `<div class="srv-icon ${cls}" style="--c:${esc(s.color)}">${esc(initials(s.name))}</div>`;
}

const URL_RE = /\bhttps?:\/\/[^\s<>"]+[^\s<>".,:;'")\]!?*_~|]/g;
const IMG_EXT = /\.(png|jpe?g|gif|webp|avif)(\?[^\s]*)?$/i;
const JUMBO = /^(?:\p{Extended_Pictographic}(?:️|\p{Emoji_Modifier})?(?:‍\p{Extended_Pictographic}(?:️|\p{Emoji_Modifier})?)*|[\u{1F1E6}-\u{1F1FF}]{2}|\s)+$/u;

function inlineFormat(raw, images) {
  const keep = [];
  const hold = html => `\u0001${keep.push(html) - 1}\u0001`;
  let s = raw.replace(URL_RE, url => {
    if (IMG_EXT.test(url) && images.length < 3) images.push(url);
    return hold(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer nofollow">${esc(url)}</a>`);
  });
  s = s.replace(/(^|[^\p{L}\p{N}_.-])@([\p{L}\p{N}_.-]{2,24})/gu, (all, pre, name) => {
    const trimmed = name.replace(/[._-]+$/, "");
    const u = userByName(name) || userByName(trimmed);
    if (u) return pre + hold(`<span class="mention" data-act="profile" data-uid="${esc(u.id)}">@${esc(u.username)}</span>`) + name.slice(u.username.length);
    if (/^(everyone|todos|here)$/i.test(trimmed)) return pre + hold(`<span class="mention">@${esc(trimmed)}</span>`) + name.slice(trimmed.length);
    return all;
  });
  s = esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/__(.+?)__/g, "<u>$1</u>")
    .replace(/~~(.+?)~~/g, "<s>$1</s>")
    .replace(/\|\|(.+?)\|\|/g, '<span class="spoiler">$1</span>')
    .replace(/(^|[^*\p{L}\p{N}])\*(?=\S)(.+?)(?<=\S)\*(?![*\p{L}\p{N}])/gu, "$1<i>$2</i>")
    .replace(/(^|[^_\p{L}\p{N}])_(?=\S)(.+?)(?<=\S)_(?![_\p{L}\p{N}])/gu, "$1<i>$2</i>")
    .replace(/^&gt; (.*)$/gm, '<span class="quote">$1</span>');
  return s.replace(/\u0001(\d+)\u0001/g, (_, i) => keep[+i]);
}
function renderText(raw) {
  const images = [];
  const jumbo = raw.length <= 40 && JUMBO.test(raw);
  const parts = raw.split(/```(?:[\w+-]*\n)?([\s\S]*?)```/);
  let html = "";
  parts.forEach((p, i) => {
    if (i % 2) { html += `<pre><code>${esc(p.replace(/\n$/, ""))}</code></pre>`; return; }
    html += p.split(/(`[^`\n]+`)/).map((seg, j) => (j % 2 ? `<code>${esc(seg.slice(1, -1))}</code>` : inlineFormat(seg, images))).join("");
  });
  return { html, images, jumbo };
}
function mentionsMe(m) {
  if (!S.me || m.sys || m.a === S.me.id) return false;
  if (m.re && m.re.a === S.me.id) return true;
  const t = m.t.toLowerCase(), n = "@" + S.me.username.toLowerCase();
  if (/(^|\s)@(everyone|todos|here)\b/.test(t)) return true;
  for (let i = t.indexOf(n); i >= 0; i = t.indexOf(n, i + 1)) {
    const before = i ? t[i - 1] : " ", after = t[i + n.length] || " ";
    if (!/[\p{L}\p{N}_.-]/u.test(before) && !/[\p{L}\p{N}_]/u.test(after)) return true;
  }
  return false;
}

const dirty = new Set();
let rafId = 0;
function schedule(...parts) {
  for (const p of parts) dirty.add(p);
  if (rafId) return;
  // Em segundo plano o navegador pausa requestAnimationFrame; o timer garante título e contadores certos.
  rafId = requestAnimationFrame(flushRender);
  rafTimer = setTimeout(flushRender, 300);
}
let rafTimer = 0;
function flushRender() {
  cancelAnimationFrame(rafId); clearTimeout(rafTimer);
  rafId = 0;
  const list = [...dirty]; dirty.clear();
  for (const p of list) try { RENDER[p] && RENDER[p](); } catch (e) { console.error("render", p, e); }
}

  rail: () => renderRail(), side: () => renderSide(), top: () => renderTop(), members: () => renderMembers(),
  user: () => renderUserPanel(), vpanel: () => renderVoicePanel(), stage: () => renderStage(),

function serverUnread(s) {

  for (const c of s.channels) { mentions += S.mentions.get(c.id) || 0; if (isUnread(c)) unread = true; }

}

  head.className = "side-head clickable";
  head.dataset.act = "server-menu";
  head.innerHTML = `<span class="title">${esc(s.name)}</span>${ic("chevron", "chev")}`;
  const owner = isOwner(s);
  const tools = id => (owner ? `<span class="ch-tools"><i data-act="ch-settings" data-id="${id}" data-tip="Editar canal">${ic("settings", "sm")}</i></span>` : "");
  const text = s.channels.filter(c => c.type === "text"), voiceCh = s.channels.filter(c => c.type === "voice");
  let h = `<div class="cat"><span>Canais de texto</span>${owner ? `<button data-act="new-channel" data-type="text" data-tip="Criar canal">${ic("plus", "sm")}</button>` : ""}</div>`;
  h += text.map(c => {
    const m = S.mentions.get(c.id) || 0;
    return `<div class="ch${S.view === "chat" && c.id === S.channelId ? " on" : ""}${isUnread(c) ? " unread" : ""}" data-act="open-ch" data-id="${c.id}" role="button" tabindex="0">${ic("hash")}<span class="ch-name">${esc(c.name)}</span>${m ? `<b class="badge">${m}</b>` : ""}${tools(c.id)}</div>`;
  }).join("");
  h += `<div class="cat"><span>Salas de voz</span>${owner ? `<button data-act="new-channel" data-type="voice" data-tip="Criar sala de voz">${ic("plus", "sm")}</button>` : ""}</div>`;
  h += voiceCh.map(c => {
    const people = [...S.voice.values()].filter(v => v.channelId === c.id).sort((a, b) => a.at - b.at);
    const live = people.some(p => p.screen);
    return `<div class="ch${S.view === "stage" && c.id === S.channelId ? " on" : ""}${live ? " live" : ""}" data-act="open-ch" data-id="${c.id}" role="button" tabindex="0">${ic("volume")}<span class="ch-name">${esc(c.name)}</span>${people.length ? `<span class="count">${people.length}/${S.voiceLimit}</span>` : ""}${tools(c.id)}</div>${people.length ? `<div class="vc-users">${people.map(vcUser).join("")}</div>` : ""}`;
  }).join("");
  body.innerHTML = h;
}

const VIEWS = { chat: "#chatView", stage: "#stageView", home: "#homeView", discover: "#discoverView" };
function setView(view) {
  if (S.view === "chat" && S.channelId) S.drafts[S.channelId] = $("#input").value;
  const changed = S.view !== view;
  S.view = view;
  for (const [k, sel] of Object.entries(VIEWS)) $(sel).classList.toggle("hidden", k !== view);
  const el = $(VIEWS[view]);
  if (changed || view === "chat") {
    el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("enter"), 450);
  }
  $("#app").classList.remove("drawer", "show-members");
  closeMention();
}
function goHome() {
  setView("home");
  S.serverId = null; S.channelId = null;
  store.set("last", { view: "home" });
  renderHome(); renderAll(); updateMini();
}
function goDiscover() {
  setView("discover");
  S.serverId = null; S.channelId = null;
  loadDiscover(); renderAll(); updateMini();
}
function openServer(id) {
  const s = S.servers.get(id);
  if (!s) return;
  const last = store.get("lastChan", {})[id];
  const c = s.channels.find(x => x.id === last && x.type === "text") || s.channels.find(x => x.type === "text");
  if (c) openChannel(c.id);
}
function openChannel(cid, join = true) {
  const s = serverOf(cid), c = chan(cid);
  if (!s || !c) return;
  if (S.view === "chat" && S.channelId) S.drafts[S.channelId] = $("#input").value;
  S.serverId = s.id;
  S.channelId = c.id;
  store.set("last", { server: s.id });
  if (c.type === "text") {
    const lc = store.get("lastChan", {}); lc[s.id] = c.id; store.set("lastChan", lc);
    setView("chat");
    cancelReply(); cancelEdit();
    openText(c);
  } else {
    setView("stage");
    if (join && V.channelId !== c.id) joinVoice(c.id);
  }
  renderRail(); renderSide(); renderTop(); renderMembers(); renderStage(); updateMini();
}

const box = () => $("#messages");
const atBottom = () => { const b = box(); return b.scrollHeight - b.scrollTop - b.clientHeight < 90; };
function scrollBottom(smooth) {
  const b = box();
  b.scrollTo({ top: b.scrollHeight, behavior: smooth && !S.settings.reduceMotion ? "smooth" : "auto" });
  $("#jumpBtn").classList.add("hidden");
  S.stick = true;
}
const msgNode = id => $("#msgList").querySelector(`.msg[data-id="${CSS.escape(id)}"]`);
function findMsg(id, cid = S.channelId) { const b = S.msgs.get(cid); return b ? b.list.find(m => m.id === id) : null; }

function openText(c) {
  const input = $("#input");
  input.placeholder = `Conversar em #${c.name}`;
  input.value = S.drafts[c.id] || "";
  autoGrow();
  S.newMarker = isUnread(c) && S.lastRead[c.id] ? { cid: c.id, ts: S.lastRead[c.id] } : null;
  const b = S.msgs.get(c.id);
  if (b && b.loaded) { renderMessages(true); markRead(c.id); }
  else {
    $("#msgList").innerHTML = Array.from({ length: 6 }, (_, i) => `<div class="skeleton"><i style="width:40px;height:40px;border-radius:50%;flex:none"></i><div style="flex:1;display:grid;gap:8px"><i style="width:${90 + (i * 37) % 80}px;height:12px"></i><i style="width:${40 + (i * 23) % 50}%;height:12px"></i></div></div>`).join("");
    loadHistory(c.id);
  }
  renderTyping();
  if (!matchMedia("(pointer: coarse)").matches) input.focus({ preventScroll: true });
}

async function loadHistory(cid, older = false) {
  let b = S.msgs.get(cid);
  if (!b) S.msgs.set(cid, (b = { list: [], more: true, loaded: false, loading: false }));
  if (b.loading || (older && !b.more)) return;
  b.loading = true;
  const first = b.list.find(m => !m.pending);
  const r = await emit("history", { channelId: cid, before: older && first ? first.id : undefined });
  b.loading = false;
  if (r.error) { toast(r.error, "error"); return; }
  if (older) b.list = [...r.messages, ...b.list];
  else { const ids = new Set(r.messages.map(m => m.id)); b.list = [...r.messages, ...b.list.filter(m => !ids.has(m.id))]; }
  b.more = r.more;
  b.loaded = true;
  if (S.channelId !== cid || S.view !== "chat") return;
  if (older) {
    const el = box(), h = el.scrollHeight, top = el.scrollTop;
    renderMessages(false);
    el.scrollTop = el.scrollHeight - h + top;
  } else {
    renderMessages(true);
    markRead(cid);
  }
}

function msgHTML(m, prev, isNew) {
  if (m.sys) {
    const u = user(m.a);
    return `<div class="msg sys${isNew ? " new" : ""}" data-id="${m.id}">${ic("arrowRight")}<span><b data-act="profile" data-uid="${u.id}" style="color:${esc(u.color)}">${esc(u.username)}</b> ${SYS[m.sys] || ""}<time title="${esc(fmtFull(m.ts))}">${fmtStamp(m.ts)}</time></span></div>`;
  }
  const u = user(m.a), s = srv(), mine = S.me && m.a === S.me.id;
  const cont = prev && !prev.sys && prev.a === m.a && !m.re && m.ts - prev.ts < 420000 && sameDay(prev.ts, m.ts);
  const { html, images, jumbo } = renderText(m.t);
  const cls = ["msg", cont && "cont", isNew && "new", m.pending && "pending", m.failed && "failed", mentionsMe(m) && "mention"].filter(Boolean).join(" ");
  let h = `<div class="${cls}" data-id="${esc(m.id)}">`;
  if (m.re) {
    const ru = user(m.re.a);
    h += `<div class="msg-reply" data-act="jump-to" data-ref="${esc(m.re.id)}">${avatar(ru, 16)}<b style="color:${esc(ru.color)}">@${esc(ru.username)}</b><span>${esc(m.re.t.replace(/\n/g, " "))}</span></div>`;
  }
  h += cont ? `<time class="msg-side-time" title="${esc(fmtFull(m.ts))}">${fmtTime(m.ts)}</time>` : avatar(u, 40, false, `data-act="profile" data-uid="${esc(u.id)}"`);
  h += `<div class="msg-body">`;
  if (!cont) {
    h += `<div class="msg-head"><span class="msg-author" data-act="profile" data-uid="${esc(u.id)}" style="color:${esc(u.color)}">${esc(u.username)}</span>${s && s.ownerId === u.id ? `<span class="owner-tag" data-tip="Dono do servidor">${ic("crown")}</span>` : ""}<time title="${esc(fmtFull(m.ts))}">${fmtStamp(m.ts)}</time></div>`;
  }
  h += `<div class="msg-text${jumbo ? " jumbo" : ""}">${html}${m.e ? `<span class="edited" title="${esc(fmtFull(m.e))}">(editado)</span>` : ""}</div>`;
  h += images.map(src => `<img class="msg-img" src="${esc(src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-act="lightbox">`).join("");
  if (m.r && Object.keys(m.r).length) {
    h += `<div class="reactions">${Object.entries(m.r).map(([e, ids]) => `<button class="react${ids.includes(S.me.id) ? " on" : ""}" data-act="react-toggle" data-emoji="${esc(e)}" data-tip="${esc(ids.slice(0, 10).map(id => user(id).username).join(", ") + (ids.length > 10 ? "…" : ""))}"><span>${esc(e)}</span><b>${ids.length}</b></button>`).join("")}<button class="react add" data-act="react" data-tip="Adicionar reação">${ic("smile")}</button></div>`;
  }
  h += `</div>`;
  if (!m.pending && !m.failed) {
    h += `<div class="msg-actions">${QUICK.map(e => `<button class="quick" data-act="quick-react" data-emoji="${e}" data-tip="Reagir com ${e}">${e}</button>`).join("")}<button data-act="react" data-tip="Adicionar reação">${ic("smile")}</button><button data-act="reply" data-tip="Responder">${ic("reply")}</button>${mine ? `<button data-act="edit" data-tip="Editar">${ic("edit")}</button>` : `<button data-act="copy" data-tip="Copiar texto">${ic("copy")}</button>`}${mine || isOwner(s) ? `<button class="danger" data-act="delete" data-tip="Apagar (Shift = sem confirmar)">${ic("trash")}</button>` : ""}</div>`;
  }
  return h + "</div>";
}

function renderMessages(toBottom) {
  const c = chan();
  if (!c) return;
  const b = S.msgs.get(c.id), list = b ? b.list : [];
  let h = "";
  if (b && !b.more) h += `<div class="chan-intro"><div class="big">${ic("hash")}</div><h2>Bem-vindo(a) a #${esc(c.name)}!</h2><p>Este é o começo do canal #${esc(c.name)}.${c.topic ? " " + esc(c.topic) : ""}</p></div>`;
  else if (b && b.more) h += `<div class="skeleton"><i style="width:40px;height:40px;border-radius:50%;flex:none"></i><div style="flex:1;display:grid;gap:8px"><i style="width:120px;height:12px"></i><i style="width:60%;height:12px"></i></div></div>`;
  let prev = null, marked = false;
  const nm = S.newMarker && S.newMarker.cid === c.id ? S.newMarker.ts : 0;
  for (const m of list) {
    if (!prev || !sameDay(prev.ts, m.ts)) h += `<div class="day">${fmtDay(m.ts)}</div>`;
    if (nm && !marked && m.ts > nm && m.a !== S.me.id) { h += `<div class="new-line"><span>NOVO</span></div>`; marked = true; }
    h += msgHTML(m, prev);
    prev = m;
  }
  $("#msgList").innerHTML = h;
  if (toBottom) {
    const line = $("#msgList .new-line");
    if (line && line.offsetTop < box().scrollHeight - box().clientHeight) { line.scrollIntoView({ block: "center" }); S.stick = atBottom(); }
    else scrollBottom(false);
  }
}
function rerenderMsg(m, domId = m.id) {
  const node = msgNode(domId), b = S.msgs.get(S.channelId);
  if (!node || !b) return;
  const i = b.list.indexOf(m);
  node.outerHTML = msgHTML(m, i > 0 ? b.list[i - 1] : null);
}
function appendMsg(m) {
  const b = S.msgs.get(S.channelId);
  const i = b.list.indexOf(m), prev = i > 0 ? b.list[i - 1] : null;
  const stick = atBottom();
  $("#msgList").insertAdjacentHTML("beforeend", (!prev || !sameDay(prev.ts, m.ts) ? `<div class="day">${fmtDay(m.ts)}</div>` : "") + msgHTML(m, prev, true));
  if (stick || (S.me && m.a === S.me.id)) scrollBottom(true);
  else $("#jumpBtn").classList.remove("hidden");
}

function markRead(cid) {
  const c = chan(cid);
  if (!c) return;
  const ts = c.last ? c.last.ts : 0;
  if (S.lastRead[cid] === ts && !S.mentions.has(cid)) return;
  S.lastRead[cid] = ts;
  S.mentions.delete(cid);
  persistRead();
  schedule("rail", "side", "title");
}
const persistRead = debounce(() => { store.set("lastRead", S.lastRead); store.set("mentions", Object.fromEntries(S.mentions)); }, 800);
function maybeRead() {
  if (S.view === "chat" && S.channelId && document.hasFocus() && atBottom()) markRead(S.channelId);
}

async function sendMessage() {
  const input = $("#input"), text = input.value.trim(), cid = S.channelId;
  if (!text || !cid) return;
  if (text.length > 2000) { toast("Mensagem muito longa (máximo de 2000 caracteres).", "warn"); return; }
  const b = S.msgs.get(cid);
  if (!b || !b.loaded) return;
  const nonce = Math.random().toString(36).slice(2, 12);
  const re = S.replyTo;
  const m = { id: "tmp-" + nonce, a: S.me.id, t: text, ts: Date.now(), nonce, pending: true };
  if (re) m.re = { id: re.id, a: re.a, t: re.t.slice(0, 140) };
  input.value = ""; S.drafts[cid] = ""; autoGrow(); cancelReply(); closeMention();
  if (S.newMarker) { S.newMarker = null; $("#msgList .new-line")?.remove(); }
  b.list.push(m);
  appendMsg(m);
  const r = await emit("send", { channelId: cid, text, replyTo: re ? re.id : undefined, nonce });
  if (r.error) {
    const i = b.list.indexOf(m);
    if (i >= 0) b.list.splice(i, 1);
    msgNode(m.id)?.remove();
    if (!input.value && S.channelId === cid) { input.value = text; autoGrow(); }
    toast(r.error, "error");
  }
}

function startEdit(id) {
  const m = findMsg(id);
  if (!m || m.a !== S.me.id || m.pending || m.sys) return;
  cancelEdit();
  const node = msgNode(id), t = node && node.querySelector(".msg-text");
  if (!t) return;
  S.editing = id;
  t.classList.add("hidden");
  t.insertAdjacentHTML("afterend", `<div class="edit-box"><textarea maxlength="2000">${esc(m.t)}</textarea><small>Esc para <a data-act="edit-cancel">cancelar</a> • Enter para <a data-act="edit-save">salvar</a></small></div>`);
  const ta = node.querySelector(".edit-box textarea");
  grow(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener("input", () => grow(ta));
  ta.addEventListener("keydown", e => {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); cancelEdit(); $("#input").focus(); }
    else if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveEdit(); }
  });
}
function cancelEdit() {
  if (!S.editing) return;
  const node = msgNode(S.editing);
  S.editing = null;
  if (node) { node.querySelector(".edit-box")?.remove(); node.querySelector(".msg-text")?.classList.remove("hidden"); }
}
async function saveEdit() {
  const id = S.editing, node = msgNode(id), ta = node && node.querySelector(".edit-box textarea");
  if (!ta) return;
  const text = ta.value.trim();
  cancelEdit();
  if (!text) { deleteMsg(id); return; }
  const r = await emit("edit", { channelId: S.channelId, id, text });
  if (r.error) toast(r.error, "error");
}
async function deleteMsg(id, skipConfirm) {
  const m = findMsg(id);
  if (!m) return;
  if (!skipConfirm) {
    const ok = await confirmBox({ title: "Apagar mensagem", html: `Tem certeza de que quer apagar esta mensagem?<div style="margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--bg-1);max-height:160px;overflow:auto;white-space:pre-wrap">${esc(m.t)}</div><small style="display:block;margin-top:10px;color:var(--muted)">Dica: segure Shift ao clicar na lixeira para apagar sem confirmar.</small>`, ok: "Apagar" });
    if (!ok) return;
  }
  const r = await emit("delete", { channelId: S.channelId, id });
  if (r.error) toast(r.error, "error");
}
function startReply(id) {
  const m = findMsg(id);
  if (!m || m.pending || m.sys) return;
  S.replyTo = m;
  const u = user(m.a), bar = $("#replyBar");
  bar.innerHTML = `${ic("reply", "sm")}<span>Respondendo a <b style="color:${esc(u.color)}">${esc(u.username)}</b></span><button class="icon-btn" type="button" data-act="reply-cancel" data-tip="Cancelar (Esc)">${ic("x", "sm")}</button>`;
  bar.classList.remove("hidden");
  $("#input").focus();
}
function cancelReply() { S.replyTo = null; $("#replyBar").classList.add("hidden"); }

    const h = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");

        return;
      }
      case "channel:delete": {
        const { s, c } = getC(d.channelId);
        if (s.ownerId !== uid) fail("Apenas o dono do servidor pode fazer isso.");
        if (c.type === "text" && s.channels.filter(x => x.type === "text").length <= 1) fail("O servidor precisa de pelo menos um canal de texto.");

        if (d.avatar !== undefined) u.avatar = pic(d.avatar);
        if (d.about !== undefined) u.about = txt(d.about, 190);

        if (!vs) return;

  setTimeout(() => {
    fire("connect");
    const list = mine();
    fire("ready", { me: { ...pub(me()), statusPref: me().status || "online" }, servers: list.map(view), users: usersOf(list), voice: [], iceServers: [], limits: { voice: 12 } });
  }, 50);

}

function emit(ev, data) {
  return new Promise(res => {
    if (!S.socket || !S.socket.connected) return res({ error: "Sem conexão com o servidor." });
    S.socket.timeout(12000).emit(ev, data || {}, (err, r) => res(err ? { error: "O servidor demorou para responder." } : r || {}));
  });
}
function connect() {
  const sock = LOCAL ? localSocket(S.token) : io({ auth: { token: S.token }, transports: ["websocket", "polling"], reconnectionDelayMax: 6000 });
  S.socket = sock;
  sock.on("connect_error", err => {
    if (err && err.message === "auth") { store.del("token"); S.token = null; sock.disconnect(); showAuth("Sua sessão expirou. Entre novamente."); return; }
    if (S.ready) $("#connBar").classList.remove("hidden");
  });
  sock.on("connect", () => $("#connBar").classList.add("hidden"));
  sock.on("disconnect", reason => { if (reason !== "io client disconnect") $("#connBar").classList.remove("hidden"); });

  sock.on("ready", onReady);
  sock.on("presence", ({ userId, status }) => {
    const u = S.users.get(userId);
    if (!u) return;
    u.status = status;
    schedule("members", "side", "home");
  });
  sock.on("user:update", ({ user: u, statusPref }) => {
    S.users.set(u.id, u);
    if (S.me && u.id === S.me.id) { S.me = { ...u, statusPref }; schedule("user"); }
    schedule("members", "side", "home", "stage");
    if (S.view === "chat") rerenderVisible();
  });
  sock.on("server:add", ({ server, users, voice }) => {
    S.servers.set(server.id, server);
    for (const u of users || []) if (!S.me || u.id !== S.me.id) S.users.set(u.id, u);
    for (const v of voice || []) S.voice.set(v.userId, v);
    renderAll();
  });
  sock.on("server:update", ({ server }) => {
    const s = S.servers.get(server.id);
    if (!s) return;
    Object.assign(s, server);
    renderAll();
    if (S.view === "chat" && S.serverId === s.id) rerenderVisible();
  });
  sock.on("server:remove", ({ serverId, reason }) => {
    const s = S.servers.get(serverId);
    if (!s) return;
    if (V.serverId === serverId) teardownVoice();
    for (const c of s.channels) { S.msgs.delete(c.id); S.mentions.delete(c.id); }
    S.servers.delete(serverId);
    if (S.serverId === serverId) goHome(); else renderAll();
    if (reason) toast(reason, "warn", 5000);
  });
  sock.on("member:add", ({ serverId, user: u }) => {
    const s = S.servers.get(serverId);
    if (!s) return;
    S.users.set(u.id, u);
    if (!s.members.includes(u.id)) s.members.push(u.id);
    schedule("members", "home", "side");
  });
  sock.on("member:remove", ({ serverId, userId }) => {
    const s = S.servers.get(serverId);
    if (!s || (S.me && userId === S.me.id)) return;
    s.members = s.members.filter(id => id !== userId);
    schedule("members", "home");
  });
  sock.on("channel:add", ({ serverId, channel }) => { const s = S.servers.get(serverId); if (s) { s.channels.push(channel); schedule("side"); } });
  sock.on("channel:update", ({ serverId, channel }) => {
    const s = S.servers.get(serverId), c = s && s.channels.find(x => x.id === channel.id);
    if (!c) return;
    Object.assign(c, { name: channel.name, topic: channel.topic });
    schedule("side", "top");
    if (S.channelId === c.id && S.view === "chat") $("#input").placeholder = `Conversar em #${c.name}`;
  });
  sock.on("channel:remove", ({ serverId, channelId }) => {
    const s = S.servers.get(serverId);
    if (!s) return;
    s.channels = s.channels.filter(c => c.id !== channelId);
    S.msgs.delete(channelId); S.mentions.delete(channelId);
    if (S.channelId === channelId) openServer(serverId); else schedule("side", "rail");
  });
  sock.on("channels:order", ({ serverId, order }) => {
    const s = S.servers.get(serverId);
    if (!s) return;
    s.channels.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    schedule("side");
  });
  sock.on("msg", onMsg);
  sock.on("msg:update", ({ channelId, m }) => {
    const b = S.msgs.get(channelId);
    if (!b) return;
    const i = b.list.findIndex(x => x.id === m.id);
    if (i < 0) return;
    b.list[i] = m;
    if (S.view === "chat" && S.channelId === channelId && S.editing !== m.id) rerenderMsg(m);
  });
  sock.on("msg:delete", ({ channelId, id }) => {
    const b = S.msgs.get(channelId);
    if (!b) return;
    const i = b.list.findIndex(x => x.id === id);
    if (i < 0) return;
    b.list.splice(i, 1);
    if (S.view === "chat" && S.channelId === channelId) {
      const el = box(), top = el.scrollTop, stick = atBottom();
      renderMessages(false);
      if (stick) scrollBottom(); else el.scrollTop = top;
    }
  });
  sock.on("typing", onTyping);
  sock.on("voice:state", onVoiceState);
  sock.on("voice:leave", onVoiceLeave);
  sock.on("voice:signal", onSignal);
  sock.on("voice:kicked", ({ reason } = {}) => { teardownVoice(); if (reason) toast(reason, "warn", 5000); renderAll(); });
}

function onReady(d) {
  const rejoin = V.channelId;
  if (rejoin) teardownVoice(true);
  S.me = d.me;
  S.users = new Map(d.users.map(u => [u.id, u]));
  S.servers = new Map(d.servers.map(s => [s.id, s]));
  S.voice = new Map(d.voice.map(v => [v.userId, v]));
  S.ice = d.iceServers || [];

  S.msgs.clear();
  for (const id of S.mentions.keys()) if (!chan(id)) S.mentions.delete(id);
  const first = !S.ready;
  S.ready = true;
  showApp();
  if (S.serverId && S.servers.has(S.serverId) && S.channelId && chan(S.channelId)) openChannel(S.channelId, false);
  else if (first) {
    const last = store.get("last", {});
    if (last.server && S.servers.has(last.server)) openServer(last.server); else goHome();
  } else goHome();
  renderAll();
  if (rejoin && chan(rejoin)) joinVoice(rejoin);

}

function onMsg({ channelId, serverId, m, nonce }) {

    }

    n.onclick = () => { window.focus(); openChannel(c.id); n.close(); };

}

/* ------------------------------------------------------------------ */
/* Sons (gerados na hora — nenhum arquivo para baixar)                 */
/* ------------------------------------------------------------------ */
const SFX = {
  join: [[523, .09], [784, .15]], leave: [[659, .09], [440, .15]], mute: [[392, .08]], unmute: [[587, .08]],
  deaf: [[330, .08], [262, .12]], undeaf: [[392, .08], [523, .12]], mention: [[880, .07], [1175, .13]],
  live: [[523, .07], [659, .07], [880, .16]], unlive: [[880, .07], [523, .14]]
};
let sfxCtx = null, sfxIdle = null;
function sfx(kind) {
  if (!S.settings.sounds || !SFX[kind]) return;
  try {
    sfxCtx = sfxCtx || new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "playback" });
    if (sfxCtx.state === "suspended") sfxCtx.resume();
    let t = sfxCtx.currentTime + 0.02;
    for (const [f, d] of SFX[kind]) {
      const o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(sfxCtx.destination);
      o.start(t); o.stop(t + d + 0.03);
      t += d * 0.8;
    }
    clearTimeout(sfxIdle);
    sfxIdle = setTimeout(() => sfxCtx && sfxCtx.suspend(), 3000);  // economiza CPU
  } catch {}
}

/* Voz, câmera e tela (WebRTC)                                         */
/* ------------------------------------------------------------------ */
function sig(to, data) { if (S.socket) S.socket.emit("voice:signal", { to, data }); }

async function getMic() {
  const st = S.settings;
  const base = { echoCancellation: st.echo, noiseSuppression: st.noise, autoGainControl: st.agc, channelCount: 1, sampleRate: 48000 };
  try {
    return await navigator.mediaDevices.getUserMedia({ audio: st.inputId ? { ...base, deviceId: { exact: st.inputId } } : base, video: false });
  } catch (e) {
    if (st.inputId && (e.name === "OverconstrainedError" || e.name === "NotFoundError")) return navigator.mediaDevices.getUserMedia({ audio: base, video: false });

}
function ensureCtx() {

  }

}
function attachMeter(uid, stream) {
  if (!V.ctx || !stream || !stream.getAudioTracks().length) return;
  const old = V.meters.get(uid);
  if (old && old.stream === stream) return;
  if (old) try { old.src.disconnect(); } catch {}
  const src = V.ctx.createMediaStreamSource(stream);
  const an = V.ctx.createAnalyser();
  an.fftSize = 256; an.smoothingTimeConstant = 0.2;
  src.connect(an); an.connect(V.sink);

}
function setSpeaking(uid, on) {
  if (V.speaking.has(uid) === on) return;
  if (on) V.speaking.add(uid); else V.speaking.delete(uid);
  for (const el of document.querySelectorAll(`[data-voice-user="${uid}"]`)) el.classList.toggle("speaking", on);
}
function meterTick() {
  const now = performance.now(), th = S.settings.sensitivity;
  for (const [uid, m] of V.meters) {
    const st = S.voice.get(uid);
    const muted = uid === S.me.id ? S.muted || S.deaf : st ? st.muted : false;
    let level = 0;
    if (!muted) {
      m.an.getByteTimeDomainData(m.buf);
      for (let i = 0; i < m.buf.length; i++) { const v = Math.abs(m.buf[i] - 128); if (v > level) level = v; }
      level /= 128;
    }
    if (level > th) m.hold = now + 280;
    setSpeaking(uid, m.hold > now);

}

async function joinVoice(cid) {
  if (V.joining) return;
  const s = serverOf(cid), c = chan(cid);
  if (!s || !c || c.type !== "voice") return;
  if (V.channelId === cid) return;
  if (!window.RTCPeerConnection || !navigator.mediaDevices) { toast("Seu navegador não suporta chamadas de voz.", "error"); return; }
  V.joining = true;
  schedule("vpanel");
  try {
    if (V.channelId) teardownVoice(true, true);
    ensureCtx();
    if (!V.mic) {
      try { V.mic = await getMic(); }
      catch { V.mic = null; toast("Microfone indisponível — você entrou só para ouvir.", "warn", 4500); }
    }
    const r = await emit("voice:join", { channelId: cid, muted: S.muted || S.deaf || !V.mic, deaf: S.deaf });
    if (r.error) throw new Error(r.error);
    V.channelId = cid; V.serverId = s.id;
    S.ice = r.iceServers || S.ice;
    applyMic();
    if (V.mic) attachMeter(S.me.id, V.mic);
    for (const p of r.peers) createPeer(p.sock, p.userId, true);
    if (!V.loop) V.loop = setInterval(meterTick, 90);
    if (!V.statsTimer) V.statsTimer = setInterval(statsTick, 2000);
    sfx("join");
  } catch (e) {
    toast(e.message || "Não foi possível entrar na sala.", "error");
    if (!V.channelId && V.mic) { V.mic.getTracks().forEach(t => t.stop()); V.mic = null; }
  } finally {
    V.joining = false;
    renderAll();
  }
}
function leaveVoice() {
  if (!V.channelId) return;
  emit("voice:leave", {});

  sfx("leave");

function teardownVoice(silent, keepMic) {
  for (const p of [...V.peers.values()]) closePeer(p);

  stopScreen(true); stopCam(true);
  for (const m of V.meters.values()) try { m.src.disconnect(); } catch {}
  V.meters.clear();
  for (const uid of [...V.speaking]) setSpeaking(uid, false);
  clearInterval(V.loop); V.loop = null;
  clearInterval(V.statsTimer); V.statsTimer = null;
  if (!keepMic && V.mic) { V.mic.getTracks().forEach(t => t.stop()); V.mic = null; }
  if (!keepMic && V.ctx && V.ctx.state === "running") V.ctx.suspend();
  V.watching.clear(); V.viewers.clear(); V.focus = null; V.ping = null;
  if (S.me && V.channelId) { const st = S.voice.get(S.me.id); if (st && st.channelId === V.channelId) S.voice.delete(S.me.id); }
  V.channelId = null; V.serverId = null;
  if (!silent) renderAll();

function createPeer(sock, userId, initiator) {

    try {
      p.makingOffer = true;
      await pc.setLocalDescription();
      sig(sock, { desc: pc.localDescription });
    } catch (e) { console.warn("[voz] oferta", e); }
    finally { p.makingOffer = false; }
  };

async function handleSignal(p, data) {

/* --- transmissão de tela: só é codificada para quem assiste --- */
function preferCodec(tv, order) {
  try {
    if (!tv.setCodecPreferences || !window.RTCRtpReceiver || !RTCRtpReceiver.getCapabilities) return;
    const codecs = RTCRtpReceiver.getCapabilities("video").codecs;
    const rank = c => { const i = order.indexOf(c.mimeType); return i < 0 ? order.length : i; };
    tv.setCodecPreferences([...codecs].sort((a, b) => rank(a) - rank(b)));
  } catch {}
}
function screenBitrate() {
  const q = QUALITY[V.screenCfg.quality] || QUALITY["1080"];
  return Math.max(900000, Math.round(q.br / Math.sqrt(Math.max(1, V.viewers.size))));
}
function addScreenTo(p) {
  if (!V.screen || p.senders.screen) return;
  const q = QUALITY[V.screenCfg.quality] || QUALITY["1080"], detail = V.screenCfg.mode === "detail";
  const vt = V.screen.getVideoTracks()[0];
  if (!vt) return;
  const tv = p.pc.addTransceiver(vt, { direction: "sendonly", streams: [V.screen], sendEncodings: [{ maxBitrate: screenBitrate(), maxFramerate: q.fps, priority: "high", networkPriority: "high" }] });
  preferCodec(tv, detail ? ["video/VP9", "video/H264", "video/VP8", "video/AV1"] : ["video/H264", "video/VP8", "video/VP9", "video/AV1"]);
  try {
    const prm = tv.sender.getParameters();
    prm.degradationPreference = detail ? "maintain-resolution" : "maintain-framerate";
    tv.sender.setParameters(prm).catch(() => {});
  } catch {}
  p.senders.screen = [tv];
  const at = V.screen.getAudioTracks()[0];
  if (at) p.senders.screen.push(p.pc.addTransceiver(at, { direction: "sendonly", streams: [V.screen] }));
  rebalance();
}
function removeScreenFrom(p) {
  for (const tv of p.senders.screen || []) {
    try { if (tv.stop) tv.stop(); else p.pc.removeTrack(tv.sender); } catch {}
  }
  delete p.senders.screen;
}
function rebalance() {
  if (!V.screen) return;
  const q = QUALITY[V.screenCfg.quality] || QUALITY["1080"], br = screenBitrate();
  for (const p of V.peers.values()) {
    const tv = p.senders.screen && p.senders.screen[0];
    if (!tv) continue;
    try {
      const prm = tv.sender.getParameters();
      if (!prm.encodings || !prm.encodings.length) continue;
      prm.encodings[0].maxBitrate = br;
      prm.encodings[0].maxFramerate = q.fps;
      tv.sender.setParameters(prm).catch(() => {});
    } catch {}
  }
}
async function startScreen(cfg) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { toast("Seu navegador não permite compartilhar a tela.", "error"); return; }
  if (!V.channelId) { toast("Entre em uma sala de voz para transmitir.", "warn"); return; }
  const q = QUALITY[cfg.quality] || QUALITY["1080"];
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { width: { ideal: q.w, max: q.w }, height: { ideal: q.h, max: q.h }, frameRate: { ideal: q.fps, max: q.fps } },
      audio: cfg.audio ? { echoCancellation: false, noiseSuppression: false, autoGainControl: false } : false,
      selfBrowserSurface: "exclude", surfaceSwitching: "include", systemAudio: cfg.audio ? "include" : "exclude"

    if (e.name !== "NotAllowedError" && e.name !== "AbortError") toast("Não foi possível compartilhar a tela.", "error");
    return;
  }
  if (!V.channelId) { stream.getTracks().forEach(t => t.stop()); return; }
  const vt = stream.getVideoTracks()[0];
  if ("contentHint" in vt) vt.contentHint = cfg.mode === "detail" ? "detail" : "motion";
  stream.getAudioTracks().forEach(t => { if ("contentHint" in t) t.contentHint = "music"; });
  vt.addEventListener("ended", () => stopScreen());
  if (V.screen) stopScreen(true);
  V.screen = stream;
  V.screenCfg = cfg;
  await emit("voice:update", { screen: stream.id });
  sfx("live");
  toast("Você está ao vivo! A transmissão só é enviada para quem assiste.", "ok", 4000);
  if (S.view !== "stage" || S.channelId !== V.channelId) openChannel(V.channelId, false);
  renderAll();
}
function stopScreen(silent) {
  if (!V.screen) return;

async function applyScreenQuality() {

  const q = QUALITY[V.screenCfg.quality] || QUALITY["1080"];
  if ("contentHint" in vt) vt.contentHint = V.screenCfg.mode === "detail" ? "detail" : "motion";
  try { await vt.applyConstraints({ width: { max: q.w }, height: { max: q.h }, frameRate: { max: q.fps } }); } catch {}
  for (const p of V.peers.values()) {

  }

}
function watch(uid) {

/* --- câmera --- */
function addCamTo(p) {

/* --- eventos de voz vindos do servidor --- */

/* --- palco (grade de participantes) --- */

    if (v.screen) {
