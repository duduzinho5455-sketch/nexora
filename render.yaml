services:
  - type: web
    name: nexora
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: nexora-db
    plan: free
