services:
  - type: web
    name: nexora
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Contas, servidores e mensagens ficam no PostgreSQL abaixo,
      # então nada se perde quando o Render reinicia o app.
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
databases:
  - name: nexora-db
    plan: free
