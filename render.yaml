services:
  - type: web
    name: nexora
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Contas, servidores e mensagens ficam no PostgreSQL abaixo,
      # então nada se perde quando o Render reinicia o app.
      # Preencha no painel do Render (Environment): não ficam no código
      - key: ADMIN_USERS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # IA Aury (Claude): chave da API da Anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      # Backups: senha que criptografa as cópias (guarde também fora do Render — sem ela o backup não abre)
      - key: BACKUP_KEY
        sync: false
      # Backups no Google Drive (gere com: node scripts/google-drive-token.js)
      - key: GDRIVE_CLIENT_ID
        sync: false
      - key: GDRIVE_CLIENT_SECRET
        sync: false
      - key: GDRIVE_REFRESH_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
databases:
  - name: nexora-db
    plan: free
